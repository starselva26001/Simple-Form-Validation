<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Validation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div><h1>Form Validation</h1></div>
        
            <form action="" class="form-container">
                    <div class="name-content">
                        <label for="">Name</label>
                        <input type="text" placeholder="Enter the name" class="" id="inputName">
                        <span class="error-msg" id="nameError"></span>
                    </div>
                    
                    <div class="email-content">
                        <label for="">Email</label>
                        <input type="Email" placeholder="Enter the Email" class="" id="inputEmail">
                        <span class="error-msg" id="emailError"></span>
                    </div>
                    
                    <div class="password-content">
                        <label for="">Password</label>
                        <input type="password" placeholder="Enter the Password" class="" id="inputPwd">
                        <span class="error-msg" id="pwdError"></span>
                    </div>
                    <div class="button-content">
                        <button class="table-btn__button disable-btn" disabled id="submit">Submit</button>
                    </div>
                    
       

    </div>
    <script src="./app.js"></script>
</body>
</html>
